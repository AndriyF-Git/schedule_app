{% extends 'base.html' %}

{% block title %}Вхід Адміністратора{% endblock %}

{% block content %}
    <div style="max-width: 400px; margin: 50px auto; padding: 30px; border: 1px solid #ddd; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.05);">
        <h2>🔑 Вхід Адміністратора</h2>
        <p>Введіть код підтвердження для доступу до панелі керування.</p>
        
        <form method="POST" action="{{ url_for('admin_login') }}">
            <label for="pin_code">Код Підтвердження (PIN):</label>
            <input type="password" id="pin_code" name="pin_code" required autofocus>
            <button type="submit">Увійти</button>
        </form>
        
        <div style="margin-top: 20px; text-align: center;">
            <a href="{{ url_for('view_schedule') }}" class="btn" style="background-color: #6c757d;">На головну сторінку</a>
        </div>
    </div>
{% endblock %}
